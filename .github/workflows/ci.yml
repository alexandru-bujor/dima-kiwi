name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci (not install) would normally be preferred, but package-lock.json was generated on
      # Windows and only pins the win32 optional native binaries for rolldown/tailwindcss-oxide/
      # lightningcss, not the linux-x64-gnu ones this runner needs — npm ci leaves those missing
      # (they're optional, so it doesn't error) and the native-dependent build step then fails.
      # npm install reconciles against the current platform and fetches the right binaries.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
